version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlruns/mlflow.db
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  mlflow-ui:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    command: mlflow ui --backend-store-uri sqlite:////app/mlruns/mlflow.db --host 0.0.0.0 --port 5000
    volumes:
      - ./mlruns:/app/mlruns
